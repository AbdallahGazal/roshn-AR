<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Product AR Experience</title>
    <!-- FIX: Pointing to the actual model-viewer script library -->
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #f7f7f7; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>

    <!-- FIX: Using your exact model file names 'roshn.glb' and 'roshn.usdz' -->
    <model-viewer 
        src="roshn.glb" 
        ios-src="roshn.usdz" 
        ar 
        ar-modes="scene-viewer quick-look webxr" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
    </model-viewer>

</body>
</html>
